name: Godot Tests

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-tests.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot-bin
          chmod +x godot-bin
      - name: Import project
        run: ./godot-bin --headless --import --path godot
      - name: Player tests
        run: |
          ./godot-bin --headless --path godot --script res://tests/test_player.gd | tee player.log
          grep -q "FAILURES: 0" player.log
      - name: Combat tests
        run: |
          ./godot-bin --headless --path godot --script res://tests/test_combat.gd | tee combat.log
          grep -q "FAILURES: 0" combat.log
